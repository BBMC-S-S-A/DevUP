# Despliegue automático en el runner autoalojado de esta misma máquina.
#
# No dispara con cada push: espera a que el workflow CI termine y solo
# despliega si terminó en verde. Desplegar sin esa comprobación significaría
# que un fallo de aislamiento entre organizaciones podría llegar a producción
# con el mismo commit que lo introdujo.
#
# El runner vive en la máquina de producción y corre como servicio de
# Windows. No hay `actions/checkout`: el trabajo no clona el repo en una
# carpeta nueva del runner, opera directamente sobre la copia ya desplegada
# en C:\Users\Juan\DevUP, que es la que tiene `.env.production` (nunca en
# git) y los contenedores ya levantados. Clonar aparte obligaría a duplicar
# ese archivo o a pasarlo por otro lado, y sería un sitio más donde podría
# quedar desincronizado.
name: Despliegue

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["claude/sales-control-workspace-platform-i99syv"]

concurrency:
  # Un despliegue a medias no se pisa con el siguiente: se espera a que
  # termine antes de arrancar el próximo.
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  desplegar:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Windows]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: C:\Users\Juan\DevUP

    steps:
      - name: Traer el commit que acaba de pasar CI
        # --ff-only a propósito: si el historial no avanza en línea recta
        # —alguien reescribió algo, o esta copia tiene cambios propios sin
        # commitear— el paso falla en vez de forzar y perder algo sin darse
        # cuenta.
        run: |
          git fetch origin claude/sales-control-workspace-platform-i99syv
          git merge --ff-only origin/claude/sales-control-workspace-platform-i99syv

      - name: Reconstruir y levantar
        run: docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build

      - name: Migrar
        # El mismo comando de docs/DESPLIEGUE.md: el compilado en dist/, no
        # tsx contra el código fuente — la imagen de producción no lo lleva.
        run: docker compose --env-file .env.production -f docker-compose.prod.yml exec -T api node apps/api/dist/db/migrate.js

      - name: Comprobar que los contenedores están sanos
        run: docker compose --env-file .env.production -f docker-compose.prod.yml ps
