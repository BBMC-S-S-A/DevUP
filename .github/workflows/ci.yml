# Lo que protege este workflow no son los tipos: es el aislamiento entre
# organizaciones.
#
# `test:rls` levanta dos organizaciones con usuarios distintos y comprueba que
# ninguna ve nada de la otra, sin un solo `where organization_id` en las
# consultas. Es el único freno automático que hay contra una fuga entre
# clientes, y hasta ahora solo corría si alguien se acordaba.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  # Un push nuevo sobre la misma rama cancela el anterior: no tiene sentido
  # esperar por un resultado que ya no describe el código.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # La misma versión mayor que en desarrollo y en producción. Probar
        # contra otra convierte el CI en verde y la producción en sorpresa.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devup
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d devup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/devup
      DATABASE_URL: postgres://devup_app:ci-secret@localhost:5432/devup
      APP_DB_PASSWORD: ci-secret
      AUTH_SECRET: secreto-solo-para-integracion-continua
      # El almacén no se levanta: ninguna de estas comprobaciones sube nada.
      # Las variables existen porque la configuración se valida al arrancar y
      # sin ellas el proceso ni empieza.
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: devup-files
      S3_ACCESS_KEY_ID: ci
      S3_SECRET_ACCESS_KEY: ci
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Migraciones
        run: npm run db:migrate

      - name: Aislamiento entre organizaciones
        run: npm run test:rls

      - name: Sala del mundo
        # Cuenta los mensajes que salen del reparto por tick —que funcione y
        # que mande uno por movimiento se parecen demasiado desde fuera— y
        # comprueba que la zona de un canal privado no viaja a quien no
        # pertenece a ese canal.
        run: npm run test:world

      - name: El registro de actividad
        # No prueba el aislamiento —eso es de test:rls— sino el camino de
        # escritura: que mover a una columna terminal se anote como «cerró» y
        # no como «movió», que reordenar no ensucie la historia, y que lo que
        # hace el asistente quede marcado como suyo. Las tres se rompen en
        # silencio: la auditoría seguiría enseñando un número, y un número
        # siempre parece verdad.
        run: npm run test:actividad --workspace apps/api

      - name: El código corto de invitación
        # Dos mitades: que normalizar perdone lo que se teclea al dictado
        # (minúsculas, guiones, la O por el cero) sin volver iguales dos
        # códigos distintos, y que en la base solo un administrador pueda
        # poner código, que renovarlo mate al anterior, y que canjear por
        # código no dé más acceso que canjear por enlace. Es una puerta de
        # entrada a una organización: lo que falle aquí mete a alguien donde
        # no debía sin que nadie abra una incidencia.
        #
        # SIN `--workspace apps/api`, y ese es el arreglo. Con él solo corría
        # `test:codigo` de la API, que es la mitad de arriba —lógica pura, sin
        # base—. La mitad contra Postgres vive en `test:invitacion`, y es
        # precisamente la que comprueba quién puede abrir la puerta: llevaba
        # desde la fusión sin ejecutarse aquí, en verde, sin que nada lo dijera.
        # El script de la raíz encadena las dos.
        run: npm run test:codigo

      - name: El clasificador de ramas
        # El guion que reordena el tablero mueve tarjetas de verdad, y se
        # equivoca sin hacer ruido: una tarea mal clasificada no falla, se queda
        # en la rama de otro y ahi la busca quien no la puso. Lo que hace
        # peligroso a un clasificador no es acertar poco, es acertar bastante —
        # porque entonces nadie revisa el resto. Se prueba contra los titulos
        # REALES del tablero, no contra ejemplos inventados.
        run: npm run test:ramas

      - name: Las carpetas de la biblioteca
        # La que justifica el fichero es el ciclo. Sin el disparador de la 0053
        # basta con mover A dentro de B y luego B dentro de A —dos gestos
        # normales por separado— para que la biblioteca tenga un anillo, y
        # entonces cualquier recorrido hacia la raiz NO falla: se cuelga. Una
        # peticion colgada es mas cara de diagnosticar que una que revienta,
        # porque no deja ni un error que buscar. Mas que borrar una carpeta no
        # se lleve sus archivos: reorganizar no puede perder lo que alguien
        # subio.
        run: npm run test:carpetas --workspace apps/api

      - name: El enlace de recuperar contrasena
        # Una comprobacion que canjea es PEOR que no comprobar nada: la
        # pantalla se abre, el enlace se gasta al pintarla, y cuando la persona
        # envia la contrasena nueva le dicen que ya se uso — se lo gasto ella
        # misma al mirarlo. Por eso se mira dos veces y DESPUES se canjea. Y se
        # fija que «caducado» y «usado» no se junten en un «no vale»: al
        # caducado hay que decirle que pida otro correo, al usado que ya la
        # cambio, y confundirlos manda a media plantilla a repetir algo hecho.
        run: npm run test:recuperar --workspace apps/api

      - name: Ajustes de un espacio de trabajo
        # La politica de la 0035 falla de DOS maneras y solo una llega como
        # error: `using` deja cero filas en silencio, `with check` revienta con
        # 42501. Lo que fija esta prueba es lo que esa diferencia protege — que
        # quien administra la organizacion no pueda convertir en SUYO un espacio
        # del equipo. Ese movimiento no rompe nada, no deja error y deja a todo
        # el mundo fuera de su propio proyecto. Mas: que borrar se lleve canales,
        # tareas y columnas, y que pida el nombre escrito.
        run: npm run test:espacios --workspace apps/api

      - name: Los puntos
        # Se ganan al cerrar, en la base, y por eso hay que fijar el bucle:
        # sin el indice unico por (tarea, motivo), cerrar una tarea, reabrirla
        # y volver a cerrarla es una maquina de puntos infinita — y no hace
        # falta mala fe, basta arrastrar una tarjeta de vuelta porque faltaba
        # algo. Mas: que reabrir NO desande el punto (desandar lo ya cobrado
        # rompe la confianza en el marcador entero), que gane el delegado y no
        # quien arrastro la tarjeta, que justificar el martes lo cerrado el
        # viernes tambien cuente, y que nadie pueda escribir puntos a mano.
        run: npm run test:puntos --workspace apps/api

      - name: Las ramas de trabajo
        # «Por repartir» tiene que ser lo que NO tiene a nadie, no lo que no
        # esta hecho: si colara lo que ya tiene dueno, el gerente veria una
        # bandeja llena de trabajo que no le toca repartir y dejaria de mirarla,
        # que es lo mismo que no tenerla. Y se fija a proposito el matiz que la
        # frase corta esconde: «quien ha trabajado» cuenta las tareas que HOY
        # estan en la rama, asi que mudar una se lleva su historia.
        run: npm run test:ramas-api --workspace apps/api

      - name: Los datos de los widgets
        # Un panel es la primera pantalla de un espacio y esta hecho de trozos
        # independientes, asi que todo lo que se rompe aqui sale en pantalla
        # como un panel perfectamente normal: un canal privado ajeno colado en
        # los no leidos —una linea de mas, no un error—, «atascada» convertida
        # en «vencida» —y una tarea sin fecha no vence nunca, que es justo la
        # que el widget existe para sacar a la superficie— y que se calcule lo
        # que no se pidio, que deshace en silencio la unica razon de esta ruta.
        run: npm run test:widgets --workspace apps/api

      - name: El panel por espacio
        # La 0049 junto el Panel con la Mesa dandole alcance de espacio, y para
        # eso solto la clave primaria de user_dashboard_prefs. Dos cosas se
        # rompen ahi sin que los tipos digan nada: el destino del `on conflict`,
        # que era `(user_id)` y ya no es un indice unico —compila, y falla en el
        # segundo guardado—, y el panel de partida multiplicado, porque sin
        # `nulls not distinct` dos filas con workspace_id nulo son distintas
        # para Postgres y nadie se queja.
        run: npm run test:panel --workspace apps/api

      - name: La portada de una organización
        # Lo que se vigila no es que salga, es lo que NO sale. Desde 0035 cada
        # espacio se aísla por sí mismo, así que pertenecer a una organización
        # no es pertenecer a todos sus espacios — y una portada que resume la
        # organización entera es justo donde esa diferencia se pierde. La fuga
        # no sería un error visible: sería una línea de más con el nombre del
        # proyecto de un cliente que no es suyo.
        run: npm run test:panorama --workspace apps/api

      - name: El diario del proyecto
        # Tres formas de contar una historia falsa con datos verdaderos, y
        # ninguna falla: saltarse las semanas vacías —que comprime el tiempo y
        # hace parecer constante un proyecto que estuvo parado—, agrupar en UTC
        # —que mete lo cerrado un domingo por la tarde en Bogotá en la semana
        # siguiente— y contar movimientos como hitos, que daría las semanas más
        # llenas a quien más arrastra tarjetas. Las tres salen en pantalla como
        # un diario perfectamente creíble.
        run: npm run test:diario --workspace apps/api

      - name: Los enlaces del grafo
        # Tres formas de estar mal que las políticas no pueden cazar, porque
        # ninguna falla: dibujar las flechas al revés, devolver solo los
        # vecinos de salida —y dejar media red invisible según por dónde se
        # entre—, y que tejer dos veces reviente la petición cuando en realidad
        # decía «esto ya estaba bien». Más la que sí es de seguridad: que
        # enlazar hacia algo que no se ve falle Y no deje rastro a medias.
        #
        # Y desde que las reglas tejen solas, lo que de verdad se vigila aquí es
        # que DESTEJAN: que quitar una rama se lleve su arista, que recalcular
        # no borre lo que escribió una persona —eso no se puede volver a
        # deducir— y que borrar una fila limpie sus enlaces ANTES de irse. Lo
        # último tiene su propia comprobación al revés, porque hacerlo en el
        # orden equivocado no falla: deja enlaces que ya no se pueden ni ver ni
        # borrar desde la API, apuntando a algo que no existe.
        run: npm run test:grafo --workspace apps/api

      - name: El criterio de migraciones
        # Comprueba el analizador que se le aplica al repositorio de un
        # cliente, y lo hace contra nuestras propias migraciones: si a las
        # veinticuatro que sí cumplen el criterio les pone un error, el
        # equivocado es el analizador. Es el único banco de pruebas honesto que
        # hay para esto.
        run: npm run test:migraciones

      - name: El lector de Terraform
        # Lo que se prueba aquí no es que lea bien, es que NO lea de más: un
        # recurso citado en un comentario no es una dependencia, y un script
        # dentro de un heredoc lleva llaves que descuadrarían el conteo de
        # bloques y harían desaparecer medio archivo sin que nada se queje.
        # Un diagrama que se cree completo engaña más que no tenerlo.
        run: npm run test:terraform

      - name: Deducir la arquitectura de un repositorio
        # El hermano del de Terraform, para los repositorios que no lo tienen
        # —que son casi todos—. Aquí se adivina más, así que lo que se fija es
        # dónde está la raya: una flecha hacia una caja que no se dibujó, una
        # dependencia de desarrollo tomada por infraestructura o un depends_on
        # que apunta a un servicio inexistente convierten el diagrama en algo
        # que no se puede creer.
        run: npm run test:repositorio

      - name: Dónde va cada caja del diagrama
        # Funciones puras, sin base ni servidor. Lo que fijan es que la
        # disposición salga legible y que un ciclo no cuelgue el bucle: un
        # diagrama con un ciclo es raro, pero no es motivo para no dibujarlo.
        run: npm run test:arquitectura

      - name: El diagnóstico de integraciones
        # Lo que más importa aquí no es que acierte, es que se calle: una
        # recomendación equivocada gasta la confianza de todas las siguientes.
        # Se comprueba contra este mismo repositorio, donde la respuesta
        # correcta se sabe.
        run: npm run test:integraciones

      - name: Las herramientas del asistente
        # Sin gastar la clave de nadie: el modelo no hace falta para comprobar
        # que una escritura acaba en la columna correcta, con su responsable y
        # con la etiqueta de procedencia. La comprobacion que mas importa es la
        # de no mover una tarea a la columna de otro espacio: eso RLS no lo
        # puede impedir cuando la persona tiene acceso a los dos, asi que lo
        # pone el codigo y si alguien lo borra, esto se pone rojo.
        run: npm run test:asistente

      - name: La puerta MCP
        # No prueba que la busqueda encuentre cosas —eso es de global_search y
        # de RLS, y ya lo cubre el aislamiento— sino lo propio de esa capa: el
        # token rotado que llega en set-cookie, quien gana entre el archivo y
        # la variable de entorno, y resolver la organizacion sin pedirle un
        # uuid al modelo. Las tres se rompen en silencio.
        run: npm run test:mcp

      - name: Lo que dice el muñeco del agente
        # No necesita base ni servidor: es un mapa en memoria con caducidad.
        # Lo que fija son dos afirmaciones sobre la verdad de lo que se pinta
        # en la sala —que lo declarado gana a lo deducido, y que todo
        # caduca—. Si la segunda se rompe, el muñeco sigue diciendo que
        # trabaja un agente que se murió hace media hora, y nada se queja.
        run: npm run test:agente

      - name: La lógica pura de la web
        # Las primeras pruebas de `apps/web`, y no son un trámite: la regla de
        # a dónde lleva cada resultado estaba escrita dos veces y ya había
        # divergido entre las dos copias. Aterrizar en el sitio equivocado no
        # se parece a un error, así que nadie lo reporta como tal — que es
        # justo para lo que sirve una prueba.
        run: npm run test:web

      - name: Migraciones idempotentes
        # Aplicarlas dos veces no debe cambiar nada ni fallar. Detecta la
        # migración que se editó después de aplicarse, que es la forma más
        # silenciosa de que dos entornos acaben con esquemas distintos.
        run: npm run db:migrate

      - name: Build
        run: npm run build

      - name: Y la API arranca de verdad
        # El paso que faltaba, y se notó tarde: la API llevaba registrado un
        # módulo de rutas DOS veces —una línea duplicada al fusionar dos
        # caminos— y Fastify rechaza declarar dos veces la misma ruta, así que
        # el proceso se caía nada más empezar. Todo lo demás estaba en verde:
        # compilar no lo ve, porque registrar dos veces el mismo módulo es
        # correcto para TypeScript, y las pruebas tampoco, porque hablan con
        # Postgres directamente y ninguna levanta el HTTP. El único sitio donde
        # se veía era al desplegar.
        #
        # No pide nada: arranca y comprueba que se queda escuchando.
        run: npm run arranca --workspace apps/api

      - name: La imagen de la API construye
        # `npm run build` compila TypeScript; esto comprueba otra cosa que se
        # rompe aparte y solo se veía al desplegar: que el Dockerfile siga
        # copiando los workspaces que la API necesita. Desde que depende de
        # `apps/mcp` para servir la puerta remota, olvidarse de una línea aquí
        # no da ningún error de tipos — da un contenedor que arranca y se cae
        # en la primera petición al MCP.
        run: docker build -f apps/api/Dockerfile -t devup-api:ci .

      - name: Y el contenedor resuelve la puerta MCP
        # Lo que de verdad se quiere saber: que dentro de la imagen final el
        # `import` de `@devup/mcp` encuentra el compilado. Se comprueba sin
        # levantar la API entera —no hay base ni almacén aquí— importando el
        # módulo a mano.
        run: |
          docker run --rm --entrypoint node devup-api:ci \
            -e "import('@devup/mcp/registro.js').then(m => {
                  if (typeof m.registrarHerramientas !== 'function') throw new Error('registrarHerramientas no está');
                  console.log('la imagen resuelve @devup/mcp');
                }).catch(e => { console.error(e.message); process.exit(1); })"
