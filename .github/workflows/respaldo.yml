# =============================================================================
# DevUP · Respaldo diario de la base de datos
#
# POR QUÉ AQUÍ Y NO EN UN SERVICIO DE ALMACENAMIENTO. Todos los destinos
# gratuitos que miramos —R2, B2— piden método de pago. GitHub Actions ya lo
# usamos, en repositorio público no tiene tope de minutos, y no hay que dar de
# alta nada.
#
# ⚠️ EL REPOSITORIO ES PÚBLICO, Y LOS ARTEFACTOS DE UN REPOSITORIO PÚBLICO LOS
# PUEDE DESCARGAR CUALQUIERA. Un volcado sin cifrar aquí sería publicar la base
# de datos entera. Por eso el volcado se cifra ANTES de subirse y el trabajo se
# niega a correr sin contraseña: no es una precaución opcional, es la condición
# que hace viable todo lo demás.
#
# LO QUE SE CIFRA NO INCLUYE LA CLAVE MAESTRA. Las credenciales de terceros
# viajan en el volcado ya cifradas con `VAULT_MASTER_KEY`, que vive en Railway
# y no aquí. Un volcado descifrado sigue sin abrir la bóveda.
#
# --- LO QUE CAMBIÓ, Y POR QUÉ ESTABA ROTO --------------------------------------
#
# Este trabajo apuntaba a Supabase y volcaba con `pg_dump` 17. Producción se
# mudó a Railway y su Postgres es 18, así que llevaba roto por partida doble:
#
#  1. El destino ya no era producción. Respaldaba una base de la que el
#     producto se había ido, así que lo que hay HOY no estaba copiado en
#     ninguna parte.
#  2. `pg_dump` se niega a volcar un servidor MÁS NUEVO que él. Aunque hubiera
#     apuntado a Railway, habría fallado con «server version mismatch».
#
# Un respaldo roto es peor que no tener respaldo: ocupa el sitio del que sí
# haría falta y nadie vuelve a mirarlo.
#
# CÓMO SE LLEGA A RAILWAY, que es la parte que no es obvia: su Postgres vive en
# una red privada y NO tiene dirección pública. La alternativa habría sido
# abrirle un proxy TCP a internet, y no se hace: una base de datos expuesta
# para que la respalde un cron es exactamente el tipo de puerta que nadie
# recuerda haber abierto. En su lugar, la CLI de Railway levanta un túnel desde
# dentro del propio trabajo, con un token de proyecto.
#
# QUÉ HAY QUE PONER EN «Settings → Secrets and variables → Actions»:
#
#   RAILWAY_TOKEN        Token de PROYECTO de Railway (Project Settings →
#                        Tokens). Con él la CLI abre el túnel sin sesión
#                        interactiva. No sirve un token personal.
#   POSTGRES_PASSWORD    La del superusuario del servicio Postgres. Hace falta
#                        el rol administrador porque el de la aplicación tiene
#                        RLS y volcaría cero filas sin dar ningún error.
#   BACKUP_PASSPHRASE    Una frase larga. **Guárdala donde no esté solo aquí:**
#                        sin ella los respaldos no se pueden abrir, y entonces
#                        no son respaldos.
#
# CÓMO SE RESTAURA UNO:
#   gpg --decrypt --batch --passphrase "$BACKUP_PASSPHRASE" \
#       -o devup.dump devup-AAAAMMDD-HHMMSSZ.dump.gpg
#   pg_restore --clean --if-exists --no-owner -d "<url de destino>" devup.dump
# =============================================================================
name: Respaldo

on:
  schedule:
    # 04:00 UTC, que en Colombia son las 23:00 del día anterior: fuera de horas.
    - cron: "0 4 * * *"
  # Para poder lanzarlo a mano el día que se despliegue algo y se quiera una
  # copia inmediata, sin esperar al ciclo.
  workflow_dispatch:

# Sin esto, dos ejecuciones solapadas pelean por nada. La nueva manda.
concurrency:
  group: respaldo
  cancel-in-progress: false

# La versión del servidor de producción. `pg_dump` tiene que ser igual o más
# nuevo, así que esto se sube el día que se suba Railway y no antes.
env:
  IMAGEN_PG: postgres:18-alpine

jobs:
  base-de-datos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Comprobar que hay con qué entrar y con qué cifrar
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          falta=0
          for nombre in RAILWAY_TOKEN POSTGRES_PASSWORD; do
            if [ -z "$(eval echo \$$nombre)" ]; then
              echo "::error::Falta el secreto $nombre."
              falta=1
            fi
          done
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Falta BACKUP_PASSPHRASE. Este repositorio es público y" \
                 "un volcado sin cifrar sería publicar la base de datos entera."
            falta=1
          fi
          [ "$falta" -eq 0 ] || exit 1

      # El túnel, que es la única manera de llegar a la red privada de Railway
      # sin exponer la base a internet. Se levanta en segundo plano y se espera
      # a que el puerto conteste: arrancar `pg_dump` antes de tiempo falla con
      # «connection refused» y parece un problema de credenciales.
      - name: Abrir el túnel a Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          railway connect Postgres --tunnel-only --port 55432 &
          for i in $(seq 1 30); do
            if timeout 1 bash -c ">/dev/tcp/127.0.0.1/55432" 2>/dev/null; then
              echo "túnel abierto"
              exit 0
            fi
            sleep 2
          done
          echo "::error::El túnel a Railway no abrió en 60 segundos."
          exit 1

      # `pg_dump` dentro de un contenedor y no con el cliente del ejecutor: la
      # versión tiene que ser igual o mayor que la del servidor, y la del
      # ejecutor cambia sin avisar. Anclarla aquí es que un cambio de imagen de
      # GitHub no rompa los respaldos un martes cualquiera.
      - name: Volcar
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          sello=$(date -u +%Y%m%d-%H%M%SZ)
          echo "SELLO=$sello" >> "$GITHUB_ENV"
          docker run --rm --network host \
            -e PGPASSWORD="$POSTGRES_PASSWORD" \
            -e PGCONNECT_TIMEOUT=30 \
            -v "$PWD:/salida" \
            "$IMAGEN_PG" \
            pg_dump --format=custom --compress=9 --no-owner --no-acl \
                    -h 127.0.0.1 -p 55432 -U postgres -d railway \
                    --file="/salida/devup-$sello.dump"

      # Que el comando termine con 0 no es que el volcado sirva. Un volcado
      # vacío con nombre de respaldo bueno es peor que no tener respaldo,
      # porque parece que estás cubierto.
      - name: Comprobar que no está vacío
        run: |
          tamano=$(wc -c < "devup-$SELLO.dump")
          echo "volcado: $tamano bytes"
          if [ "$tamano" -lt 1000 ]; then
            echo "::error::El volcado pesa $tamano bytes. Eso no puede estar bien."
            exit 1
          fi

      # LA COMPROBACIÓN QUE DE VERDAD CONVIERTE ESTO EN UN RESPALDO: restaurarlo.
      #
      # Leer el índice con `pg_restore --list` decía que el archivo no estaba
      # corrupto, y nada más. Un respaldo que nadie ha restaurado nunca no se
      # sabe si es un respaldo — se descubre el día que hace falta, que es el
      # único día en que no se puede arreglar. Aquí se levanta un Postgres
      # vacío, se restaura dentro y se cuenta lo que salió.
      - name: Restaurarlo en un Postgres de usar y tirar
        run: |
          docker run -d --name verificacion \
            -e POSTGRES_PASSWORD=verificacion \
            -p 55433:5432 "$IMAGEN_PG"
          for i in $(seq 1 30); do
            docker exec verificacion pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 2
          done

          docker run --rm --network host -v "$PWD:/salida" \
            -e PGPASSWORD=verificacion "$IMAGEN_PG" \
            pg_restore --no-owner --no-acl -h 127.0.0.1 -p 55433 -U postgres \
                       -d postgres "/salida/devup-$SELLO.dump"

          # Que haya tablas no basta: un volcado del esquema sin datos también
          # las tiene. Lo que se comprueba es que hay ORGANIZACIONES, que es lo
          # que este respaldo existe para no perder.
          orgs=$(docker exec -e PGPASSWORD=verificacion verificacion \
            psql -U postgres -d postgres -tAc "select count(*) from public.organizations")
          tablas=$(docker exec -e PGPASSWORD=verificacion verificacion \
            psql -U postgres -d postgres -tAc \
            "select count(*) from information_schema.tables where table_schema='public'")
          echo "restaurado: $tablas tablas, $orgs organizaciones"
          docker rm -f verificacion >/dev/null
          if [ "${orgs:-0}" -lt 1 ]; then
            echo "::error::El volcado se restaura pero no trae ninguna organización." \
                 "Casi seguro se voló con un rol con RLS en vez de con el superusuario."
            exit 1
          fi

      - name: Cifrar
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          # La contraseña por descriptor de archivo y no en la línea de
          # comandos: los argumentos de un proceso los ve cualquiera que mire la
          # tabla de procesos.
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --symmetric \
            --cipher-algo AES256 \
            --passphrase-fd 0 \
            --output "devup-$SELLO.dump.gpg" \
            "devup-$SELLO.dump"
          rm -f "devup-$SELLO.dump"
          ls -l "devup-$SELLO.dump.gpg"

      - name: Guardar
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-${{ env.SELLO }}
          path: devup-${{ env.SELLO }}.dump.gpg
          # 90 días es el máximo de la capa gratuita. Con una copia diaria son
          # 90 puntos de restauración; la base son megas, no gigas.
          retention-days: 90
          if-no-files-found: error
