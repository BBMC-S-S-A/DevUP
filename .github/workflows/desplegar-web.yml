# Despliegue de la web en Cloudflare Workers.
#
# POR QUÉ SOLO LA WEB. La API y el tiempo real los despliega Railway solo, en
# cuanto se le conecta el repositorio: es su función nativa y no pide guardar
# ningún token aquí. La web no vive en Railway, así que es la única pieza que
# necesita una acción propia.
#
# SUSTITUYE al `deploy.yml` anterior, que corría en un runner autoalojado en el
# portátil de Juan y levantaba `docker-compose.prod.yml`. Ese montaje se retiró
# el 3 de septiembre de 2026 —producción salió del portátil— y el workflow se
# quedó apuntando a algo que ya no es producción: si alguien hubiera registrado
# el runner "para que se despliegue solo", cada fusión habría intentado
# desplegar el Docker equivocado.
#
# NO DISPARA CON CADA PUSH: espera a que CI termine y solo sigue si terminó en
# verde. Desplegar sin esa comprobación significaría que un fallo de
# aislamiento entre organizaciones podría llegar a producción con el mismo
# commit que lo introduce.
name: Desplegar web

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["claude/sales-control-workspace-platform-i99syv"]
  # Para poder desplegar a mano sin esperar a un push — por ejemplo al cambiar
  # las direcciones de la API, que se incrustan al compilar.
  workflow_dispatch:

concurrency:
  group: desplegar-web
  cancel-in-progress: false

jobs:
  desplegar:
    # En un `workflow_run` hay que comprobar el resultado a mano; en un
    # `workflow_dispatch` no hay resultado que comprobar y se pasa.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # En un `workflow_run`, `checkout` trae por defecto la rama por
          # defecto y no el commit que disparó el workflow. Se pide explícito.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Sin el token no se puede desplegar, y fallar en rojo cada vez que
      # alguien fusiona algo no informa de nada: enseña un aviso y sale bien.
      # El día que el secreto exista, este paso deja de cortar sin tocar nada.
      - name: Comprobar que hay token de Cloudflare
        id: token
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF" ]; then
            echo "hay=no" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin CLOUDFLARE_API_TOKEN en los secretos del repositorio: la web no se despliega. Añádelo en Settings → Secrets and variables → Actions."
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar
        if: steps.token.outputs.hay == 'si'
        run: npm ci

      - name: Construir y desplegar
        if: steps.token.outputs.hay == 'si'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Variables del repositorio y no secretos: son direcciones públicas,
          # y tenerlas a la vista es lo que permite cambiarlas sin editar este
          # archivo. Los valores por defecto son los `*.up.railway.app` de
          # ahora; cuando los dominios propios funcionen, se cambian ahí.
          #
          # SE INCRUSTAN AL COMPILAR: cambiarlas obliga a volver a ejecutar
          # esto (de ahí el `workflow_dispatch` de arriba).
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api-production-7b95.up.railway.app' }}
          NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL || 'wss://live-production-976a.up.railway.app' }}
        working-directory: apps/web
        run: npm run cf:deploy
